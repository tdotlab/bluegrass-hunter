[project]
name = "bluegrass-hunter"
version = "0.2.0"
description = "A Kentucky field guide for researching local businesses and missing websites"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "httpx",
  "pydantic>=2.0",
  "uvicorn[standard]",
]

[project.scripts]
lead-research = "main:cli"

[tool.setuptools]
py-modules = ["agent", "geography", "main", "models", "report", "scoring"]
